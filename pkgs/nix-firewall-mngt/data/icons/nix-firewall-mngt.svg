<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5277C3"/>
      <stop offset="100%" stop-color="#03112b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7800" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a51d2d" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M256 28 C256 28 80 80 80 80 C80 80 80 260 80 260 C80 380 256 484 256 484 C256 484 432 380 432 260 C432 260 432 80 432 80 Z"
        fill="url(#shieldGrad)" stroke="#5277C3" stroke-width="8" stroke-linejoin="round"/>
  <!-- Inner shield highlight -->
  <path d="M256 60 C256 60 110 104 110 104 C110 104 110 252 110 252 C110 356 256 448 256 448 C256 448 402 356 402 252 C402 252 402 104 402 104 Z"
        fill="none" stroke="#7a9ad6" stroke-width="3" stroke-linejoin="round" opacity="0.4"/>
  <!-- Firewall bars (horizontal) -->
  <rect x="170" y="180" width="172" height="16" rx="8" fill="url(#glowGrad)"/>
  <rect x="170" y="220" width="172" height="16" rx="8" fill="url(#glowGrad)"/>
  <rect x="170" y="260" width="172" height="16" rx="8" fill="url(#glowGrad)"/>
  <!-- Lock/check symbol in center -->
  <circle cx="256" cy="332" r="28" fill="none" stroke="#ff7800" stroke-width="6"/>
  <polyline points="240,332 252,344 272,320" fill="none" stroke="#ff7800" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- NixOS snowflake accent (small, top center) -->
  <g transform="translate(256,130)" fill="#7a9ad6" opacity="0.6">
    <rect x="-2" y="-20" width="4" height="40" rx="2"/>
    <rect x="-2" y="-20" width="4" height="40" rx="2" transform="rotate(60)"/>
    <rect x="-2" y="-20" width="4" height="40" rx="2" transform="rotate(-60)"/>
  </g>
</svg>
